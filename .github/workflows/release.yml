name: Package and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build PNG icons, wrap folder, zip
        run: |
          python3 - << 'PY'
          import struct, zlib
          from pathlib import Path

          def png(w, h, rgb_rows):
              def chunk(tag, data):
                  crc = zlib.crc32(tag + data) & 0xffffffff
                  return struct.pack(">I", len(data)) + tag + data + struct.pack(">I", crc)
              raw = b"".join(b"\x00" + bytes(row) for row in rgb_rows)
              return (
                  b"\x89PNG\r\n\x1a\n"
                  + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 2, 0, 0, 0))
                  + chunk(b"IDAT", zlib.compress(raw, 9))
                  + chunk(b"IEND", b"")
              )

          def draw(size, gray=False):
              red = (180, 180, 180) if gray else (255, 0, 0)
              white = (255, 255, 255)
              rows = []
              pad = max(2, size // 10)
              rx0, ry0 = pad, int(size * 0.28)
              rx1, ry1 = size - pad, size - int(size * 0.28)
              rad = max(3, size // 8)
              tx0 = int(size * 0.40)
              tx1 = int(size * 0.66)
              ty0 = int(size * 0.38)
              ty1 = int(size * 0.62)
              for y in range(size):
                  row = []
                  for x in range(size):
                      color = white
                      inside = (rx0 + rad <= x <= rx1 - rad and ry0 <= y <= ry1) or (
                          ry0 + rad <= y <= ry1 - rad and rx0 <= x <= rx1
                      )
                      corners = (
                          (rx0 + rad, ry0 + rad),
                          (rx1 - rad, ry0 + rad),
                          (rx0 + rad, ry1 - rad),
                          (rx1 - rad, ry1 - rad),
                      )
                      for cx, cy in corners:
                          if (x - cx) ** 2 + (y - cy) ** 2 <= rad * rad:
                              inside = True
                      if inside:
                          color = red
                      if ty0 <= y <= ty1 and tx0 <= x <= tx1:
                          t = (y - ty0) / max(1, ty1 - ty0)
                          left = tx0
                          right = tx0 + int((tx1 - tx0) * (1 - abs(2 * t - 1)))
                          if left <= x <= right:
                              color = white
                      row.extend(color)
                  rows.append(row)
              return png(size, size, rows)

          icons = Path("icons")
          icons.mkdir(exist_ok=True)
          (icons / "icon16.png").write_bytes(draw(16))
          (icons / "icon48.png").write_bytes(draw(48))
          (icons / "icon128.png").write_bytes(draw(128))
          (icons / "icon128-off.png").write_bytes(draw(128, gray=True))
          print("icons ready")
          PY
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          STAGE=$(mktemp -d)
          mkdir -p "$STAGE/YouTube-Declutter/icons"
          cp LICENSE README.md manifest.json background.js content.js styles.css popup.html popup.css popup.js "$STAGE/YouTube-Declutter/"
          cp icons/mark.svg icons/icon16.png icons/icon48.png icons/icon128.png icons/icon128-off.png "$STAGE/YouTube-Declutter/icons/"
          mkdir -p dist
          (cd "$STAGE" && zip -r "$GITHUB_WORKSPACE/dist/YouTube-Declutter-v${VERSION}.zip" YouTube-Declutter)
          unzip -l "dist/YouTube-Declutter-v${VERSION}.zip"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: YouTube Declutter v${{ env.VERSION }}
          files: dist/YouTube-Declutter-v${{ env.VERSION }}.zip
          fail_on_unmatched_files: true
          make_latest: true
          body: |
            Unzip this file, then in Chrome:

            1. Open chrome://extensions
            2. Turn on Developer mode
            3. Load unpacked → select the YouTube-Declutter folder (the one that contains manifest.json)

            Do not load the .zip itself. Do not use Source code (zip).
