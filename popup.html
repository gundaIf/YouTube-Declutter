<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>YouTube Declutter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <img class="mark" src="icons/mark.svg" width="36" height="36" alt="" />
    <div class="titles">
      <p class="kicker">Use YouTube intentionally</p>
      <h1>Dashboard</h1>
    </div>
    <label class="switch" title="Turn the extension on or off">
      <input type="checkbox" id="enabled" />
      <span></span>
    </label>
  </header>

  <div class="friction" id="friction" hidden>
    <span id="frictionText"></span>
    <button type="button" id="frictionCancel">Cancel</button>
  </div>

  <p class="status" id="status">On</p>

  <section id="sessionBox">
    <p class="label">Session</p>
    <p class="session" id="sessionLine">No session running</p>
    <select id="modeSelect" aria-label="Session mode"></select>
    <div class="two">
      <button type="button" class="ghost" id="newSession">New session</button>
      <button type="button" class="ghost" id="options">All settings</button>
    </div>
  </section>

  <section>
    <p class="label">Pause for a bit</p>
    <div class="seg four" id="pause"></div>
    <button type="button" class="resume" id="resume" hidden>Resume now</button>
  </section>

  <section>
    <p class="label">Timer <span class="scope" id="scopeTimer"></span></p>
    <div class="seg four" id="timer">
      <button type="button" data-timer="0">Off</button>
      <button type="button" data-timer="10">10m</button>
      <button type="button" data-timer="25">25m</button>
      <button type="button" data-timer="45">45m</button>
    </div>
  </section>

  <section>
    <p class="label">Right now <span class="scope" id="scope"></span></p>
    <label class="check"><input type="checkbox" id="hideShorts" />Hide Shorts</label>
    <label class="check"><input type="checkbox" id="hideRelated" />Hide related videos</label>
    <label class="check"><input type="checkbox" id="showComments" />Show comments</label>
    <label class="check"><input type="checkbox" id="disableAutoplay" />Autoplay off</label>
    <label class="check"><input type="checkbox" id="ambient" />Ambient light</label>
  </section>

  <footer>
    Pause turns everything off for a while. The switch turns it off until you flip it back. v2.0.0
  </footer>
  <script src="shared.js"></script>
  <script src="popup.js"></script>
</body>
</html>
